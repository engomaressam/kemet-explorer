<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Link previews (LinkedIn, Slack, X, WhatsApp). The site is served from /kemet-explorer on GitHub Pages. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kemet Explorer" />
    <meta property="og:description" content="A React Native and Expo guide to Egypt's ancient sites and museums, with live weather, Wikipedia summaries and a trip planner along the Nile." />
    <meta property="og:url" content="https://engomaressam.github.io/kemet-explorer/" />
    <meta property="og:image" content="https://engomaressam.github.io/kemet-explorer/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/kemet-explorer/manifest.json" />
    <link rel="apple-touch-icon" href="/kemet-explorer/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kemet" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #fbf6ec;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #121417;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Kemet Explorer needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
