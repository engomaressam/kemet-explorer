  <circle cx="44" cy="361" r="7" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="60" y="366" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF" text-anchor="start">name@example.com</text>
  <text x="24" y="404" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="start">Password</text>
  <rect x="24" y="412" width="312" height="42" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <circle cx="44" cy="433" r="7" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="60" y="438" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF" text-anchor="start">Your password</text>
  <text x="320" y="438" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">show</text>
  <rect x="24" y="472" width="312" height="44" rx="10" fill="#374151" stroke="#374151" stroke-width="1.5"/>
  <text x="180.0" y="499" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Log In</text>
  <line x1="40" y1="540" x2="140" y2="540" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="180" y="544" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">New here?</text>
  <line x1="220" y1="540" x2="320" y2="540" stroke="#9CA3AF" stroke-width="1.5"/>
  <rect x="40" y="556" width="280" height="44" rx="10" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
  <text x="180.0" y="583" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">Sign Up</text>
