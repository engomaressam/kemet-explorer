<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760">
  <title>Login</title>
  <rect x="0" y="0" width="360" height="760" fill="#FFFFFF"/>
  <text x="18" y="22" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1F2937" text-anchor="start">9:41</text>
  <rect x="314" y="12" width="26" height="12" rx="3" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="145" y="90" width="70" height="70" rx="16" fill="#374151" stroke="none" stroke-width="1.5"/>
  <text x="180" y="133" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LOGO</text>
