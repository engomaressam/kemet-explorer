  <line x1="234" y1="647" x2="279" y2="647" stroke="#374151" stroke-width="1.2"/>
  <rect x="24" y="670" width="312" height="44" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
